name: agenticplc
region: sfo
services:
  - name: web
    git:
      repo_clone_url: https://github.com/redwhitblack/agenticplc.git
      branch: main
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
      initial_delay_seconds: 15
      period_seconds: 10
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
